name: WebLimbAI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Verify Dependencies
        run: go mod verify

      - name: Build Monorepo Binaries
        run: go build ./...

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Test Suite with Data Race Detector
        env:
          CI: "true"
          ENV: "test"
        run: go test -race -v -timeout 10m ./...
