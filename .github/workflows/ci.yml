name: WebLimbAI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Verify Dependencies
        run: go mod verify

      - name: Build Monorepo Binaries
        run: go build ./...

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Test Suite with Data Race Detector
        env:
          CI: "true"
          ENV: "test"
        run: |
          set +e
          FAILED=0
          for pkg in $(go list ./...); do
            echo "Testing $pkg..."
            OUTPUT=$(go test -race -v -timeout 2m "$pkg" 2>&1)
            STATUS=$?
            if [ $STATUS -ne 0 ]; then
              FAILED=1
              echo "FAILED: $pkg"
              echo "$OUTPUT"
            else
              echo "PASSED: $pkg"
            fi
          done
          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
